# Fabrica el instalador de Windows del lector de impresoras y lo publica en
# https://github.com/ernestobm2012-tech/ebmagenciaia/releases/download/lector/LectorImpresoras-Instalador.exe
name: Instalador del lector de impresoras

on:
  push:
    branches: [main]
    paths: ['lector-impresoras/**', '.github/workflows/lector-instalador.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lector-impresoras
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Programa (.exe)
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --noconsole --onedir --name LectorImpresoras agente_lector.py
      - name: Instalador
        shell: pwsh
        run: |
          $env:LECTOR_VERSION = "1.0.${{ github.run_number }}"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc instalador\LectorImpresoras.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lector *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create lector --title "Lector de impresoras" --notes "Instalador para Windows del lector de impresoras. Se actualiza solo con cada cambio."
          }
          gh release upload lector salida\LectorImpresoras-Instalador.exe --clobber
